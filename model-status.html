<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>حالة نموذج الذكاء الاصطناعي – المُخبر الرقمي الذكي</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <button class="mobile-menu-btn" id="sidebarToggle" aria-label="القائمة"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/Logo.png" alt="الشعار">
      <h1>حالة النموذج</h1>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span id="themeIcon"></span>
      <span id="themeLabel">الوضع الداكن</span>
    </button>
    <div class="sidebar-notif">
      <button type="button" class="notif-bell" id="notifBell" aria-label="الإشعارات"><i class="fa-solid fa-bell" aria-hidden="true"></i><span id="notifBadge" class="notif-badge hidden">0</span></button>
      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>الإشعارات</span>
          <button type="button" class="notif-mark-all" id="notifMarkAll">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="investigator.html">البلاغات</a>
      <a href="model-status.html" class="active">حالة النموذج</a>
      <a href="about.html">نبذة عن المشروع</a>
      <a href="#" id="logout">تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="card">
      <h2>نموذج الذكاء الاصطناعي المدرب</h2>
      <div id="modelStatus"></div>
    </div>
    <div class="card">
      <h2>خطوات التدريب</h2>
      <ol class="training-steps">
        <li>تثبيت scikit-learn: <code>pip install scikit-learn</code></li>
        <li>تشغيل التدريب: <code>python train_model.py</code></li>
        <li>النموذج يُحفظ في <code>models/cph_model.pkl</code></li>
        <li>أعد تشغيل التطبيق لتحميل النموذج</li>
      </ol>
    </div>
  </main>

  <script src="static/js/theme.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      if (typeof initNotifications === 'function') initNotifications();
      document.getElementById('logout').onclick = () => {
        localStorage.removeItem('cph_token');
        localStorage.removeItem('cph_user');
        window.location.href = 'index.html';
      };
      const res = await apiRequest('/ai-status');
      const data = await res.json();
      document.getElementById('modelStatus').innerHTML = `
        <div class="model-status ${data.model_loaded ? 'loaded' : 'not-loaded'}">
          <span class="status-dot"></span>
          <strong>${data.model_loaded ? 'النموذج جاهز ويعمل' : 'النموذج غير محمّل'}</strong>
          <p>${data.message}</p>
        </div>
      `;
    });
  </script>
  <style>
    .model-status { padding: 20px; border-radius: 8px; margin: 16px 0; }
    .model-status.loaded { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; }
    .model-status.not-loaded { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 8px; }
    .model-status.loaded .status-dot { background: #22c55e; }
    .model-status.not-loaded .status-dot { background: #f59e0b; }
    .training-steps { padding-right: 24px; line-height: 2; }
    .training-steps code { background: var(--bg-primary); padding: 2px 8px; border-radius: 4px; }
  </style>
</body>
</html>
