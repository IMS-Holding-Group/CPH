<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>بوابة الضحية – المُخبر الرقمي الذكي</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <button class="mobile-menu-btn" id="sidebarToggle" aria-label="القائمة"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/Logo.png" alt="الشعار">
      <h1>بوابة الضحية</h1>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span id="themeIcon"></span>
      <span id="themeLabel">الوضع الداكن</span>
    </button>
    <div class="sidebar-notif">
      <button type="button" class="notif-bell" id="notifBell" aria-label="الإشعارات"><i class="fa-solid fa-bell" aria-hidden="true"></i><span id="notifBadge" class="notif-badge hidden">0</span></button>
      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>الإشعارات</span>
          <button type="button" class="notif-mark-all" id="notifMarkAll">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="victim.html" class="active">تقديم بلاغ</a>
      <a href="chat.html">التواصل</a>
      <a href="about.html">نبذة عن المشروع</a>
      <a href="#" id="logout">تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="card">
      <div class="card-header-flex">
        <h2>تقديم بلاغ جديد</h2>
        <span class="quick-tip">املأ جميع الحقول بدقة لتسريع التحليل</span>
      </div>
      <div id="formAlert" class="alert hidden"></div>
      <form id="reportForm">
        <div class="form-row">
          <label>نوع البلاغ</label>
          <select name="report_type">
            <option value="ابتزاز">ابتزاز إلكتروني</option>
            <option value="احتيال">احتيال مالي</option>
          </select>
        </div>
        <div class="form-row">
          <label>وصف البلاغ</label>
          <textarea name="description" rows="4" required placeholder="صف التفاصيل..."></textarea>
        </div>
        <div class="form-row">
          <label>المبلغ المأخوذ/المطالب به (ريال)</label>
          <input type="number" name="financial_amount" min="0" step="0.01" placeholder="0">
        </div>
        <div class="form-row">
          <label>الإقامة</label>
          <select name="residency_status" id="residencyStatus">
            <option value="سعودي">سعودي</option>
            <option value="غير سعودي">غير سعودي</option>
          </select>
        </div>
        <div class="form-row hidden" id="iqamaRow">
          <label>رقم الإقامة <span class="required">*</span></label>
          <input type="text" name="iqama_number" placeholder="إجباري لغير السعوديين">
        </div>
        <div class="form-row">
          <label>رابط أو حساب المبتز</label>
          <div class="form-inline-row">
            <input type="text" name="suspect_link" id="suspectLink" placeholder="رابط أو @username">
            <button type="button" class="btn btn-secondary" id="analyzeLinkBtn">تحليل الرابط</button>
            <button type="button" class="btn btn-secondary" id="analyzeAccountBtn">تحليل الحساب</button>
          </div>
          <div id="analysisPreview" class="analysis-preview hidden"></div>
        </div>
        <div class="form-row">
          <label>صور المحادثات</label>
          <input type="file" name="screenshots" id="screenshots" multiple accept="image/*">
        </div>
        <div class="form-row">
          <label>فيديو (اختياري)</label>
          <input type="file" name="media" id="media" accept="video/*,image/*">
        </div>
        <button type="submit" class="btn btn-primary">تقديم البلاغ</button>
      </form>
    </div>

    <div class="card">
      <h2>حالة بلاغاتك</h2>
      <p class="status-desc">تظهر هنا نفس الحالة المسجّلة في النظام: <strong>قيد الانتظار</strong> (لم يُعالَج بعد)، <strong>تحت التحقيق</strong>، <strong>منتهي</strong>. افتح البلاغ لرؤية التفاصيل.</p>
      <div id="reportsList"></div>
    </div>
  </main>

  <script src="static/js/theme.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/victim.js"></script>
</body>
</html>
