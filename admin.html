<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>صفحة الإدارة – المُخبر الرقمي الذكي</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <button class="mobile-menu-btn" id="sidebarToggle" aria-label="القائمة"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/Logo.png" alt="الشعار">
      <h1>الإدارة</h1>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span id="themeIcon"></span>
      <span id="themeLabel">الوضع الداكن</span>
    </button>
    <div class="sidebar-notif">
      <button type="button" class="notif-bell" id="notifBell" aria-label="الإشعارات"><i class="fa-solid fa-bell" aria-hidden="true"></i><span id="notifBadge" class="notif-badge hidden">0</span></button>
      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>الإشعارات</span>
          <button type="button" class="notif-mark-all" id="notifMarkAll">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="investigator.html">البلاغات</a>
      <a href="admin.html" class="active">الإدارة</a>
      <a href="about.html">نبذة عن المشروع</a>
      <a href="#" id="logout">تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="card">
      <h2>إدارة البلاغات</h2>
      <div id="adminReportSelect">
        <label>اختر البلاغ</label>
        <select id="reportSelect">
          <option value="">-- اختر --</option>
        </select>
      </div>
      <div id="adminForm" class="hidden">
        <div class="form-row">
          <label>حالة البلاغ</label>
          <select id="statusSelect">
            <option value="قيد الانتظار">قيد الانتظار</option>
            <option value="تحت التحقيق">تحت التحقيق</option>
            <option value="منتهي">منتهي</option>
          </select>
        </div>
        <div class="form-row">
          <label>مرحلة القضية</label>
          <input type="text" id="caseStage" placeholder="مثال: التحقق من الهوية">
        </div>
        <div class="form-row">
          <label>ملاحظات تحقيق</label>
          <textarea id="notes" rows="4" placeholder="أضف ملاحظات..."></textarea>
        </div>
        <div class="form-row">
          <label>المحقق</label>
          <select id="investigatorSelect">
            <option value="">-- تعيين محقق --</option>
          </select>
        </div>
        <button class="btn btn-primary" id="saveBtn">حفظ التحديثات</button>
      </div>
    </div>
  </main>

  <script src="static/js/theme.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/admin.js"></script>
</body>
</html>
