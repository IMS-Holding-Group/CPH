<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>لوحة المحقق – المُخبر الرقمي الذكي</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <button class="mobile-menu-btn" id="sidebarToggle" aria-label="القائمة"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/Logo.png" alt="الشعار">
      <h1>لوحة المحقق</h1>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span id="themeIcon"></span>
      <span id="themeLabel">الوضع الداكن</span>
    </button>
    <div class="sidebar-notif">
      <button type="button" class="notif-bell" id="notifBell" aria-label="الإشعارات"><i class="fa-solid fa-bell" aria-hidden="true"></i><span id="notifBadge" class="notif-badge hidden">0</span></button>
      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>الإشعارات</span>
          <button type="button" class="notif-mark-all" id="notifMarkAll">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="investigator.html" class="active">البلاغات</a>
      <a href="chat.html">التواصل</a>
      <a href="admin.html">الإدارة</a>
      <a href="model-status.html">حالة النموذج</a>
      <a href="about.html">نبذة عن المشروع</a>
      <a href="#" id="logout">تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="stats-cards">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">إجمالي البلاغات</span>
      </div>
      <div class="stat-card stat-new">
        <span class="stat-value" id="statNew">0</span>
        <span class="stat-label">جديد</span>
      </div>
      <div class="stat-card stat-investigating">
        <span class="stat-value" id="statInvestigating">0</span>
        <span class="stat-label">تحت التحقيق</span>
      </div>
      <div class="stat-card stat-done">
        <span class="stat-value" id="statDone">0</span>
        <span class="stat-label">منتهي</span>
      </div>
    </div>
    <div class="card dashboard-header">
      <h2>البلاغات</h2>
      <p class="dashboard-desc">عرض شبيه بالشات – جديد، قديم، محلول أو لا</p>
      <div class="dashboard-toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="بحث في البلاغات...">
        </div>
        <div class="filter-bar">
          <button class="btn btn-outline filter-btn active" data-filter="all">الكل</button>
          <button class="btn btn-outline filter-btn" data-filter="new">جديد</button>
          <button class="btn btn-outline filter-btn" data-filter="investigating">تحت التحليل</button>
          <button class="btn btn-outline filter-btn" data-filter="solved">محلول / غير محلول</button>
        </div>
      </div>
    </div>
    <div class="reports-chat-view" id="reportsList">
      <!-- عرض البلاغات كرسائل/بطاقات شبيهة بالشات -->
    </div>
  </main>

  <script src="static/js/theme.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/investigator.js"></script>
</body>
</html>
