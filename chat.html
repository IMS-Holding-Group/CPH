<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>صفحة التواصل – المُخبر الرقمي الذكي</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <button class="mobile-menu-btn" id="sidebarToggle" aria-label="القائمة"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
  <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/Logo.png" alt="الشعار">
      <h1>التواصل</h1>
    </div>
    <button class="theme-toggle" id="themeToggle">
      <span id="themeIcon"></span>
      <span id="themeLabel">الوضع الداكن</span>
    </button>
    <div class="sidebar-notif">
      <button type="button" class="notif-bell" id="notifBell" aria-label="الإشعارات"><i class="fa-solid fa-bell" aria-hidden="true"></i><span id="notifBadge" class="notif-badge hidden">0</span></button>
      <div id="notifPanel" class="notif-panel hidden">
        <div class="notif-panel-head">
          <span>الإشعارات</span>
          <button type="button" class="notif-mark-all" id="notifMarkAll">تعليم الكل كمقروء</button>
        </div>
        <div id="notifList" class="notif-list"></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" id="backLink">رجوع</a>
      <a href="about.html">نبذة عن المشروع</a>
      <a href="#" id="logout">تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="card">
      <h2>اختر البلاغ للتواصل</h2>
      <select id="reportSelect">
        <option value="">-- اختر بلاغ --</option>
      </select>
    </div>
    <div class="card chat-card hidden" id="chatCard">
      <h2>المحادثة</h2>
      <div id="messagesContainer"></div>
      <div class="chat-input">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك...">
        <button class="btn btn-primary" id="sendBtn">إرسال</button>
      </div>
    </div>
  </main>

  <style>
    .chat-card { display: flex; flex-direction: column; }
    #messagesContainer { max-height: 400px; overflow-y: auto; padding: 16px; background: var(--bg-primary); border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .msg { padding: 12px; margin: 8px 0; border-radius: 8px; max-width: 80%; }
    .msg.sent { background: var(--tech-blue); color: white; margin-right: auto; }
    .msg.received { background: var(--silver); margin-left: auto; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; margin-bottom: 0; }
  </style>

  <script src="static/js/theme.js"></script>
  <script src="static/js/config.js"></script>
  <script src="static/js/auth.js"></script>
  <script src="static/js/notifications.js"></script>
  <script src="static/js/chat.js"></script>
</body>
</html>
